<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EdgeSense - {{ page_title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">

            <!-- BIGGER LOGO -->
            <a href="{{ url_for('dashboard') }}" class="logo">
                <span class="logo-mark">E</span>
                <span class="logo-text">EdgeSense</span>
            </a>

            <!-- SIMPLE NAV -->
            <ul class="nav-links">
                <li><a href="{{ url_for('dashboard') }}">Dashboard</a></li>
                <li><a href="{{ url_for('alerts') }}">Alerts</a></li>
                <li><a href="{{ url_for('about') }}">About</a></li>
            </ul>

            <a href="{{ url_for('alerts') }}" class="nav-button">Send Alert</a>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <div>
                <h3>EdgeSense</h3>
                <p>Accessibility-focused mobility support for safer navigation day and night.</p>
            </div>
            <div>
                <p>Hackathon Prototype</p>
            </div>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
